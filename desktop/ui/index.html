<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('rukksh.shell.scheme')
          var legacy = localStorage.getItem('minis.shell.scheme')
          if (legacy !== null) {
            if (mode === null) {
              mode = legacy
              localStorage.setItem('rukksh.shell.scheme', mode)
            }
            localStorage.removeItem('minis.shell.scheme')
          }
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var scheme = dark ? 'dark' : 'light'
          var root = document.documentElement
          root.dataset.schemeMode = mode
          root.dataset.scheme = scheme
          root.style.colorScheme = scheme
        } catch (e) {
          /* 隐私模式下忽略本地存储错误 */
        }
      })()
    </script>
    <style>
      /* ============================================================================
       * 桌面端壳页面 —— 对齐主界面 .rukksh-surface 极简无框风格
       * 分层设计：主舞台仅保留服务启动入口，账号与身份收纳在左下角头像浮层。
       * ========================================================================= */
      :root {
        --sl-bg: #ffffff;
        --sl-side: #f6f8fa;
        --sl-panel: #ffffff;
        --sl-hover: #eaeef2;
        --sl-active: #e8edf2;
        --sl-line: #d1d9e0;
        --sl-line-strong: #a6b0bb;
        --sl-focus-line: #656d76;
        --sl-fg: #1f2328;
        --sl-fg-2: #424a53;
        --sl-muted: #656d76;
        --sl-accent: #1f883d;
        --sl-accent-hover: #1a7f37;
        --sl-accent-soft: #dafbe1;
        --sl-on-accent: #ffffff;
        --sl-link: #0969da;
        --sl-danger: #b42318;
        --sl-danger-soft: #fff1f0;
        --df-edge-line: rgba(15, 15, 15, 0.12);
        --df-radius: 20px;
        --sl-pop-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.06);
      }

      :root[data-scheme='dark'] {
        --sl-bg: #101213;
        --sl-side: #151819;
        --sl-panel: #191c1e;
        --sl-hover: #24292b;
        --sl-active: #2b3230;
        --sl-line: #303638;
        --sl-line-strong: #58625d;
        --sl-focus-line: #919c9f;
        --sl-fg: #e6edf3;
        --sl-fg-2: #c0c9cd;
        --sl-muted: #919c9f;
        --sl-accent: #c8ff5f;
        --sl-accent-hover: #d5ff88;
        --sl-accent-soft: #26341d;
        --sl-on-accent: #172009;
        --sl-link: #c8ff5f;
        --sl-danger: #ffb4ab;
        --sl-danger-soft: #361e1d;
        --df-edge-line: rgba(255, 255, 255, 0.14);
        --sl-pop-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [hidden] {
        display: none !important;
      }

      button,
      [type='button'],
      [type='submit'] {
        -webkit-appearance: none;
        appearance: none;
        font-family: inherit;
      }

      input {
        font-family: inherit;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: var(--sl-fg);
        -webkit-font-smoothing: antialiased;
      }

      button:not(:disabled) {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: none;
      }

      /* ------------------------------------------------ 窗缘缩放热区 */
      #rz {
        position: fixed;
        inset: 0;
        z-index: 80;
        pointer-events: none;
      }
      #rz i {
        position: absolute;
        pointer-events: auto;
      }
      #rz i[data-dir='North'] {
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        cursor: ns-resize;
      }
      #rz i[data-dir='South'] {
        bottom: 0;
        left: 0;
        right: 0;
        height: 5px;
        cursor: ns-resize;
      }
      #rz i[data-dir='West'] {
        top: 0;
        bottom: 0;
        left: 0;
        width: 5px;
        cursor: ew-resize;
      }
      #rz i[data-dir='East'] {
        top: 0;
        bottom: 0;
        right: 0;
        width: 5px;
        cursor: ew-resize;
      }
      #rz i[data-dir='NorthWest'] {
        top: 0;
        left: 0;
        width: 12px;
        height: 12px;
        cursor: nwse-resize;
      }
      #rz i[data-dir='NorthEast'] {
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        cursor: nesw-resize;
      }
      #rz i[data-dir='SouthWest'] {
        bottom: 0;
        left: 0;
        width: 12px;
        height: 12px;
        cursor: nesw-resize;
      }
      #rz i[data-dir='SouthEast'] {
        bottom: 0;
        right: 0;
        width: 12px;
        height: 12px;
        cursor: nwse-resize;
      }

      /* ------------------------------------------------ 无框壳容器 */
      .shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        border-radius: var(--df-radius);
        overflow: hidden;
        background: var(--sl-bg);
        color: var(--sl-fg);
      }

      body:not(.is-maximized) .shell::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483640;
        border-radius: var(--df-radius);
        box-shadow: inset 0 0 0 1px var(--df-edge-line);
        pointer-events: none;
      }

      body.is-maximized .shell,
      body.is-mac .shell {
        border-radius: 0;
      }

      body.is-mac .shell::after {
        content: none;
      }

      body.is-mac #rz {
        display: none;
      }

      /* ------------------------------------------------ 过渡模糊遮罩 */
      .veil {
        position: absolute;
        inset: 0;
        z-index: 55;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
        background: color-mix(in srgb, var(--sl-bg) 55%, transparent);
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.6s ease,
          backdrop-filter 0.6s ease;
      }
      .veil--on {
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 1;
        pointer-events: auto;
      }
      .veil-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--sl-line);
        border-top-color: var(--sl-fg);
        border-radius: 999px;
        animation: veil-spin 0.8s linear infinite;
      }
      @keyframes veil-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ------------------------------------------------ 顶栏 */
      .topbar {
        position: absolute;
        inset: 0 0 auto;
        z-index: 61;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 16px;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .topbar-drag {
        flex: 1;
        align-self: stretch;
        pointer-events: auto;
      }

      .appearance-btn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--sl-muted);
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      .appearance-btn:hover {
        background: var(--sl-hover);
        color: var(--sl-fg);
      }
      .appearance-btn:focus-visible {
        outline: 2px solid var(--sl-focus-line);
        outline-offset: 0;
      }
      .appearance-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .win-controls {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .wbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: var(--sl-side);
        color: var(--sl-muted);
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      .wbtn:hover {
        background: var(--sl-hover);
        color: var(--sl-fg);
      }
      .wbtn--close:hover {
        background: var(--sl-danger-soft);
        color: var(--sl-danger);
      }
      .wbtn:focus-visible {
        outline: 2px solid var(--sl-focus-line);
        outline-offset: 0;
      }
      .wbtn svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* macOS 使用原生红绿灯（Unified 标题栏垂直居中于 y=26px），隐藏自绘按钮并让出左上角占位 */
      body.is-mac .win-controls {
        display: none;
      }
      body.is-mac .topbar {
        height: 52px;
        padding: 0 16px 0 92px;
      }
      body.is-mac.is-fullscreen .topbar {
        padding-left: 16px;
      }

      /* ------------------------------------------------ 主舞台 */
      .stage-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 48px 24px 72px;
      }

      .launcher {
        width: 100%;
        max-width: 460px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      /* 品牌区 */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }
      .hero-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        margin-bottom: 4px;
      }
      .hero-title {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.25;
        color: var(--sl-fg);
      }
      .hero-sub {
        color: var(--sl-muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        padding: 4px 12px;
        border: 1px solid var(--sl-line);
        border-radius: 999px;
        background: var(--sl-side);
        color: var(--sl-muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .status-dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--sl-accent);
      }
      body[data-phase='error'] .status-pill {
        border-color: color-mix(in srgb, var(--sl-danger) 35%, transparent);
        background: var(--sl-danger-soft);
        color: var(--sl-danger);
      }
      body[data-phase='error'] .status-dot {
        background: var(--sl-danger);
      }
      body[data-phase='boot'] .status-dot,
      body[data-phase='entering'] .status-dot {
        animation: sl-pulse 1.2s ease-in-out infinite;
      }
      @keyframes sl-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* 会话失效提示 */
      .notice {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 10px 10px 14px;
        border: 1px solid color-mix(in srgb, var(--sl-danger) 35%, transparent);
        border-radius: 10px;
        background: var(--sl-danger-soft);
        font-size: 13px;
      }
      .notice-text {
        flex: 1;
        min-width: 0;
        color: var(--sl-danger);
      }
      .notice-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--sl-danger);
        font-size: 16px;
        line-height: 1;
      }
      .notice-close:hover {
        background: color-mix(in srgb, var(--sl-danger) 12%, transparent);
      }

      /* ------------------------------------------------ 启动区（双按钮 → 远程展开动画） */
      .launch-stage {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* 初始双按钮行 */
      .launch-pair {
        display: flex;
        align-items: stretch;
        width: 100%;
      }
      .launch-slot {
        min-width: 0;
        overflow: hidden;
        transition:
          flex 220ms cubic-bezier(0.22, 1, 0.36, 1) 60ms,
          opacity 160ms ease 80ms,
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1) 60ms,
          margin 220ms cubic-bezier(0.22, 1, 0.36, 1) 60ms;
      }
      .launch-slot--local {
        flex: 1 1 0;
        margin-right: 10px;
        transform-origin: left center;
      }
      .launch-slot--remote {
        flex: 1 1 0;
        transform-origin: right center;
      }
      .launch-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 44px;
        padding: 0 18px;
        overflow: hidden;
        border: 1px solid var(--sl-line);
        border-radius: 10px;
        background: var(--sl-panel);
        color: var(--sl-fg);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease;
      }
      .launch-btn:not(:disabled):hover {
        border-color: var(--sl-line-strong);
        background: var(--sl-side);
      }
      .launch-btn:focus-visible {
        outline: 2px solid var(--sl-focus-line);
        outline-offset: 0;
      }
      .launch-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .launch-btn--primary {
        border-color: var(--sl-accent);
        background: var(--sl-accent);
        color: var(--sl-on-accent);
        font-weight: 600;
      }
      .launch-btn--primary:not(:disabled):hover {
        border-color: var(--sl-accent-hover);
        background: var(--sl-accent-hover);
        color: var(--sl-on-accent);
      }

      /* 远程模式展开时：
         Beat 1 (0–180ms): 本地按钮先横向缩起淡出，远程按钮顺势铺宽；
         Beat 2 (110–360ms): 按钮行收起，远程输入卡自同区域展开 */
      .launch-stage.is-remote .launch-slot--local {
        flex: 0 0 0;
        margin-right: 0;
        opacity: 0;
        transform: scale(0.92) translateX(-8px);
        pointer-events: none;
        transition:
          flex 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms,
          opacity 100ms ease 0ms,
          transform 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms,
          margin 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms;
      }
      .launch-stage.is-remote .launch-slot--remote {
        opacity: 0;
        transform: scale(0.985);
        pointer-events: none;
        transition:
          flex 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms,
          opacity 130ms ease 110ms,
          transform 180ms cubic-bezier(0.22, 1, 0.36, 1) 110ms;
      }
      .launch-pair-wrap {
        display: grid;
        grid-template-rows: 1fr;
        opacity: 1;
        transition:
          grid-template-rows 210ms cubic-bezier(0.22, 1, 0.36, 1) 70ms,
          opacity 160ms ease 90ms;
      }
      .launch-pair-wrap > .launch-pair {
        min-height: 0;
        overflow: hidden;
      }
      .launch-stage.is-remote .launch-pair-wrap {
        grid-template-rows: 0fr;
        opacity: 0;
        pointer-events: none;
        transition:
          grid-template-rows 200ms cubic-bezier(0.22, 1, 0.36, 1) 110ms,
          opacity 130ms ease 110ms;
      }

      /* 远程输入框展开卡 */
      .remote-expand {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transform: translateY(-4px) scale(0.985);
        pointer-events: none;
        transition:
          grid-template-rows 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms,
          opacity 140ms ease 0ms,
          transform 200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms;
      }
      .launch-stage.is-remote .remote-expand {
        grid-template-rows: 1fr;
        opacity: 1;
        transform: none;
        pointer-events: auto;
        transition:
          grid-template-rows 250ms cubic-bezier(0.22, 1, 0.36, 1) 110ms,
          opacity 200ms ease 130ms,
          transform 250ms cubic-bezier(0.22, 1, 0.36, 1) 110ms;
      }
      .remote-expand__clip {
        min-height: 0;
        overflow: hidden;
      }

      .card {
        padding: 16px 18px;
        border: 1px solid var(--sl-line);
        border-radius: 12px;
        background: var(--sl-panel);
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      .card-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .card h2 {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--sl-fg);
      }
      .card p {
        color: var(--sl-muted);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .card-desc {
        margin-bottom: 12px;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--sl-muted);
        font-size: 12px;
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      .back-btn:hover {
        background: var(--sl-hover);
        color: var(--sl-fg);
      }
      .back-btn svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ------------------------------------------------ 通用表单与按钮 */
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row[hidden] {
        display: none;
      }

      .input {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 11px;
        border: 1px solid var(--sl-line);
        border-radius: 7px;
        background: var(--sl-bg);
        color: var(--sl-fg);
        font-size: 13px;
        line-height: 1.5;
        transition: border-color 150ms ease;
      }
      .input::placeholder {
        color: var(--sl-muted);
        opacity: 0.7;
      }
      .input:hover:not(:focus) {
        border-color: var(--sl-line-strong);
      }
      .input:focus {
        border-color: var(--sl-focus-line);
      }

      .btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--sl-line);
        border-radius: 7px;
        background: var(--sl-panel);
        color: var(--sl-fg);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease;
      }
      .btn:not(:disabled):hover {
        border-color: var(--sl-line-strong);
        background: var(--sl-side);
      }
      .btn:focus-visible {
        outline: 2px solid var(--sl-focus-line);
        outline-offset: 0;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn--primary {
        border-color: var(--sl-accent);
        background: var(--sl-accent);
        color: var(--sl-on-accent);
        font-weight: 600;
      }
      .btn--primary:not(:disabled):hover {
        border-color: var(--sl-accent-hover);
        background: var(--sl-accent-hover);
        color: var(--sl-on-accent);
      }
      .btn--sm {
        height: 30px;
        padding: 0 10px;
        font-size: 12px;
      }
      .btn--quiet {
        border-color: transparent;
        background: transparent;
        color: var(--sl-muted);
      }
      .btn--quiet:not(:disabled):hover {
        border-color: transparent;
        background: var(--sl-hover);
        color: var(--sl-fg);
      }
      .btn--danger-ghost {
        color: var(--sl-danger);
      }
      .btn--danger-ghost:not(:disabled):hover {
        border-color: color-mix(in srgb, var(--sl-danger) 45%, transparent);
        background: var(--sl-danger-soft);
        color: var(--sl-danger);
      }

      .tag {
        display: inline-flex;
        flex: none;
        align-items: center;
        height: 20px;
        padding: 0 8px;
        border: 1px solid var(--sl-line);
        border-radius: 999px;
        background: var(--sl-side);
        color: var(--sl-muted);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
      }
      .tag--ok {
        border-color: color-mix(in srgb, var(--sl-accent) 42%, transparent);
        background: var(--sl-accent-soft);
        color: var(--sl-accent);
      }
      .tag--danger {
        border-color: color-mix(in srgb, var(--sl-danger) 40%, transparent);
        background: var(--sl-danger-soft);
        color: var(--sl-danger);
      }

      /* 历史远程地址胶囊 */
      .badges {

    <script>
      const { invoke } = window.__TAURI__.core
      const { listen } = window.__TAURI__.event

      /* ------------------------------------------------------------ 平台与外观 */

      const isMac = typeof navigator !== 'undefined' && /Mac/i.test(navigator.platform)
      document.body.classList.toggle('is-mac', isMac)
      const winCmd = (cmd, args) => invoke(`plugin:window|${cmd}`, args).catch(() => {})

      const SCHEME_KEY = 'rukksh.shell.scheme'
      const SCHEME_LABELS = { system: '跟随系统', light: '浅色', dark: '深色' }
      const NEXT_SCHEME = { system: 'light', light: 'dark', dark: 'system' }
      const appearanceBtn = document.getElementById('appearance-btn')
      const appearanceIcon = document.getElementById('appearance-icon')
      const darkMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null

      function readSchemeMode() {
        try {
          const v = localStorage.getItem(SCHEME_KEY)
          return v === 'light' || v === 'dark' || v === 'system' ? v : 'system'
        } catch (e) {
          return 'system'
        }
      }

      function applyScheme(mode) {
        const effective = mode === 'system' ? (darkMedia && darkMedia.matches ? 'dark' : 'light') : mode
        const root = document.documentElement
        root.dataset.schemeMode = mode
        root.dataset.scheme = effective
        root.style.colorScheme = effective
        const next = NEXT_SCHEME[mode]
        appearanceIcon.setAttribute('href', 'lucide.svg#appearance-' + mode)
        appearanceBtn.title = `当前：${SCHEME_LABELS[mode]} · 切换为${SCHEME_LABELS[next]}`
        appearanceBtn.setAttribute('aria-label', `外观：${SCHEME_LABELS[mode]}，切换为${SCHEME_LABELS[next]}`)
        if (isMac) {
          winCmd('set_theme', { value: mode === 'system' ? null : effective })
        }
      }

      let schemeMode = readSchemeMode()
      applyScheme(schemeMode)

      appearanceBtn.addEventListener('click', () => {
        schemeMode = NEXT_SCHEME[schemeMode]
        try {
          localStorage.setItem(SCHEME_KEY, schemeMode)
        } catch (e) {
          /* 忽略存储受限 */
        }
        applyScheme(schemeMode)
      })

      if (darkMedia && darkMedia.addEventListener) {
        darkMedia.addEventListener('change', () => {
          if (schemeMode === 'system') applyScheme('system')
        })
      }

      /* ------------------------------------------------------------ 窗口控制 */

      const winMaxIcon = document.getElementById('win-max-icon')

      function paintMaxIcon(maximized) {
        document.body.classList.toggle('is-maximized', Boolean(maximized))
        winMaxIcon.querySelector('use').setAttribute('href', maximized ? 'lucide.svg#restore' : 'lucide.svg#maximize')
        winMaxIcon.parentElement.title = maximized ? '还原' : '最大化'
        winMaxIcon.parentElement.setAttribute('aria-label', maximized ? '还原' : '最大化')
      }

      if (!isMac) {
        document.getElementById('win-min').addEventListener('click', () => winCmd('minimize'))
        document.getElementById('win-max').addEventListener('click', async () => {
          await winCmd('toggle_maximize')
          paintMaxIcon(await invoke('plugin:window|is_maximized').catch(() => false))
        })
        document.getElementById('win-close').addEventListener('click', () => winCmd('close'))
      }

      const syncWindowState = () => {
        if (!isMac) {
          invoke('plugin:window|is_maximized')
            .then(paintMaxIcon)
            .catch(() => {})
          return
        }
        invoke('plugin:window|is_fullscreen')
          .then((fs) => document.body.classList.toggle('is-fullscreen', Boolean(fs)))
          .catch(() => {})
      }
      syncWindowState()
      window.addEventListener('resize', syncWindowState)

      if (!isMac) {
        document.querySelectorAll('#rz i').forEach((handle) => {
          handle.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return
            e.preventDefault()
            winCmd('start_resize_dragging', { value: handle.dataset.dir })
          })
        })
      }

      /* ------------------------------------------------------------ 悬浮通知 */

      const toastsEl = document.getElementById('toasts')

      function toast(text, kind) {
        if (!toastsEl) return
        const el = document.createElement('div')
        el.className = 'toast'
        if (kind) el.dataset.kind = kind
        el.textContent = text
        toastsEl.appendChild(el)
        while (toastsEl.children.length > 3) toastsEl.firstElementChild.remove()
        requestAnimationFrame(() => el.classList.add('toast--on'))
        setTimeout(
          () => {
            el.classList.remove('toast--on')
            setTimeout(() => el.remove(), 300)
          },
          kind === 'error' ? 6000 : 4000,
        )
      }

      /* -------------------------------------------------------- 左下角账号面板 */

      const accountDock = document.getElementById('account-dock')
      const accountBtn = document.getElementById('account-btn')
      const accountBtnAvatar = document.getElementById('account-btn-avatar')
      const accountDot = document.getElementById('account-dot')
      const accountPanel = document.getElementById('account-panel')

      function setAccountPanelOpen(open) {
        accountPanel.hidden = !open
        accountBtn.setAttribute('aria-expanded', open ? 'true' : 'false')
      }

      accountBtn.addEventListener('click', (e) => {
        e.stopPropagation()
        setAccountPanelOpen(accountPanel.hidden)
      })

      document.addEventListener('pointerdown', (e) => {
        if (!accountPanel.hidden && !accountDock.contains(e.target)) {
          setAccountPanelOpen(false)
        }
      })

      /* ------------------------------------------------------------ 启动与远程展开 */

      const launchStage = document.getElementById('launch-stage')
      const remoteExpand = document.getElementById('remote-expand')
      const detailEl = document.getElementById('detail')
      const remoteInput = document.getElementById('remote-url')
      const remoteForm = document.getElementById('remote-form')
      const localBtn = document.getElementById('choose-local')
      const openRemoteBtn = document.getElementById('open-remote')
      const remoteBackBtn = document.getElementById('remote-back')
      const remoteBtn = document.getElementById('choose-remote')
      const remoteTagEl = document.getElementById('remote-tag')
      const veilEl = document.getElementById('veil')
      const loginHostidBtn = document.getElementById('login-hostid')
      const loginHostidHintEl = document.getElementById('login-hostid-hint')

      let remoteExpanded = false
      let sessionExpiredFlag = false
      let hostidBase = ''
      let lastState = null

      function setRemoteExpanded(open, focusInput = false) {
        remoteExpanded = Boolean(open)
        launchStage.classList.toggle('is-remote', remoteExpanded)
        remoteExpand.setAttribute('aria-hidden', remoteExpanded ? 'false' : 'true')
        if (remoteExpanded && focusInput) {
          setTimeout(() => remoteInput.focus(), 240)
        }
      }

      openRemoteBtn.addEventListener('click', () => setRemoteExpanded(true, true))
      remoteBackBtn.addEventListener('click', () => setRemoteExpanded(false))

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        if (!accountPanel.hidden) {
          setAccountPanelOpen(false)
          accountBtn.focus()
          return
        }
        if (remoteExpanded) {
          setRemoteExpanded(false)
          openRemoteBtn.focus()
        }
      })

      const LABELS = {
        idle: '请选择要连接的后端',
        boot: '正在启动本地服务器…',
        entering: '正在进入实例…',
        returning: '正在返回…',
        ready: '已就绪',
        remote: '远程模式',
        error: '启动失败',
      }

      let returningVeilDone = false
      function applyVeil(phase) {
        if (phase === 'entering') {
          returningVeilDone = false
          veilEl.classList.add('veil--on')
          return
        }
        if (phase === 'returning') {
          if (returningVeilDone) return
          returningVeilDone = true
          veilEl.style.transition = 'none'
          veilEl.classList.add('veil--on')
          void veilEl.offsetHeight
          veilEl.style.transition = ''
          setTimeout(() => {
            veilEl.classList.remove('veil--on')
            invoke('desktop_return_done').catch(() => {})
          }, 700)
          return
        }
        returningVeilDone = false
        veilEl.classList.remove('veil--on')
      }

      function setBusy(busy) {
        localBtn.disabled = busy
        openRemoteBtn.disabled = busy
        remoteBtn.disabled = busy
        if (loginHostidBtn) loginHostidBtn.disabled = busy
      }

      function originOf(url) {
        try {
          return new URL(url).origin
        } catch (e) {
          return normalizeHost(url)
        }
      }

      function sessionFor(mode) {
        const inst = lastState && lastState.instance
        if (!inst || inst.mode !== mode) return null
        if (mode === 'remote' && originOf(inst.url) !== originOf(remoteInput.value)) return null
        return inst
      }

      function renderCards() {
        const phase = document.body.dataset.phase
        const mode = document.body.dataset.mode
        const localInst = sessionFor('local')
        const remoteInst = sessionFor('remote')
        const localBoot = phase === 'boot' && mode === 'local'

        localBtn.textContent = localBoot ? '启动中…' : localInst ? '回到本地实例' : '启动本地服务器'
        openRemoteBtn.textContent = remoteInst ? '回到远程实例' : '启动远程后端'
        remoteBtn.textContent = remoteInst ? '回到实例' : '连接'

        if (remoteInst) {
          remoteTagEl.hidden = false
          remoteTagEl.textContent = '运行中'
          remoteTagEl.className = 'tag tag--ok'
        } else if (mode === 'remote') {
          remoteTagEl.hidden = false
          remoteTagEl.textContent = '上次使用'
          remoteTagEl.className = 'tag'
        } else {
          remoteTagEl.hidden = true
        }
      }

      function render(state) {
        lastState = state
        document.body.dataset.phase = state.phase
        if (state.mode) document.body.dataset.mode = state.mode
        detailEl.textContent = state.detail || LABELS[state.phase] || state.phase
        if (state.remoteBaseUrl) rememberHost(state.remoteBaseUrl)
        if (state.remoteBaseUrl && !remoteInput.value) {
          remoteInput.value = state.remoteBaseUrl
        }
        if (state.instance && state.instance.mode === 'remote') {
          setRemoteExpanded(true, false)
        }
        setBusy(state.phase === 'boot' || state.phase === 'entering')
        renderCards()
        applyVeil(state.phase)
        sessionExpiredFlag = !!state.sessionExpired
        paintSessionBanner()
      }

      invoke('desktop_state')
        .then(render)
        .catch((e) => toast(String(e), 'error'))
      listen('rukksh://status', (event) => render(event.payload))

      localBtn.addEventListener('click', async () => {
        if (sessionFor('local')) {
          invoke('desktop_show_instance').catch((e) => toast(String(e), 'error'))
          return
        }
        setBusy(true)
        try {
          await invoke('desktop_choose_local')
        } catch (e) {
          toast(String(e), 'error')
          setBusy(false)
        }
      })

      remoteForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        if (sessionFor('remote')) {
          invoke('desktop_show_instance').catch((err) => toast(String(err), 'error'))
          return
        }
        rememberHost(remoteInput.value)
        try {
          await invoke('desktop_choose_remote', { url: remoteInput.value })
        } catch (err) {
          toast(String(err), 'error')
        }
      })

      remoteInput.addEventListener('input', renderCards)

      /* ------------------------------------------------------------ 远程历史标签 */

      const HOSTS_KEY = 'desktop_remote_hosts'
      const HOSTS_MAX = 6
      const hostsEl = document.getElementById('remote-hosts')

      function normalizeHost(url) {
        return (url || '').trim().replace(/\/+$/, '')
      }

      function loadHosts() {
        try {
          const list = JSON.parse(localStorage.getItem(HOSTS_KEY) || '[]')
          return Array.isArray(list)
            ? list.filter((v) => typeof v === 'string' && v).slice(0, HOSTS_MAX)
            : []
        } catch (e) {
          return []
        }
      }

      function saveHosts(list) {
        try {
          localStorage.setItem(HOSTS_KEY, JSON.stringify(list))
        } catch (e) {
          /* 忽略隐私模式写失败 */
        }
        renderHosts(list)
      }

      function rememberHost(url) {
        const v = normalizeHost(url)
        if (!v) return
        const list = loadHosts()
        if (list[0] === v) return
        saveHosts([v, ...list.filter((h) => h !== v)].slice(0, HOSTS_MAX))
      }

      function renderHosts(list) {
        const hosts = list || loadHosts()
        hostsEl.hidden = hosts.length === 0
        hostsEl.textContent = ''
        for (const url of hosts) {
          const tag = document.createElement('span')
          tag.className = 'badge'

          const pick = document.createElement('button')
          pick.type = 'button'
          pick.className = 'badge-url'
          pick.textContent = url.replace(/^https?:\/\//, '')
          pick.title = url
          pick.addEventListener('click', () => {
            remoteInput.value = url
            renderCards()
            remoteInput.focus()
          })

          const del = document.createElement('button')
          del.type = 'button'
          del.className = 'badge-del'
          del.title = '删除这条记录'
          del.setAttribute('aria-label', '删除 ' + url)
          del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="lucide.svg#close" /></svg>'
          del.addEventListener('click', () => {
            saveHosts(loadHosts().filter((h) => h !== url))
          })

          tag.append(pick, del)
          hostsEl.appendChild(tag)
        }
      }

      renderHosts()

      /* -------------------------------------------------------- 身份切换、SSO 与本地用户 */

      const idsEl = document.getElementById('user-ids')
      const localNameEl = document.getElementById('local-name')
      const hostidUrlEl = document.getElementById('hostid-url')
      const hostidForm = document.getElementById('hostid-form')
      const pickAvatarEl = document.getElementById('pick-avatar')
      const pickAvatarBtnEl = document.getElementById('pick-avatar-btn')
      const avatarFileEl = document.getElementById('avatar-file')
      const avatarClearEl = document.getElementById('avatar-clear')
      const ssoProfileEl = document.getElementById('sso-profile')
      const ssoHostEl = document.getElementById('sso-host')
      const ssoBadgeEl = document.getElementById('sso-badge')

      let users = { current: 'local', local: { name: '', avatar: '' }, sso: null }
      let pendingAvatar = null

      function localAvatarDraft() {
        return pendingAvatar !== null ? pendingAvatar : users.local.avatar
      }

      function paintAvatar(el, name, avatar) {
        el.textContent = ''
        const fallback = (name || '?').trim().charAt(0).toUpperCase() || '?'
        if (avatar) {
          const img = document.createElement('img')
          img.alt = name || '用户'
          img.addEventListener('error', () => {
            img.remove()
            el.textContent = fallback
          })
          img.src = avatar
          el.appendChild(img)
        } else {
          el.textContent = fallback
        }
      }

      function paintLocalAvatar() {
        const avatar = localAvatarDraft()
        paintAvatar(pickAvatarEl, localNameEl.value || users.local.name || '本地用户', avatar)
        avatarClearEl.hidden = !avatar
      }

      function currentIdentity() {
        if (users.current === 'sso' && users.sso) {
          return { name: users.sso.name, avatar: users.sso.avatar, sub: users.sso.email || 'HostID SSO' }
        }
        return { name: users.local.name || '本地用户', avatar: users.local.avatar, sub: '本地用户' }
      }

      function idRow(kind, name, avatar, sub) {
        const active = users.current === kind
        const row = document.createElement('button')
        row.type = 'button'
        row.className = 'id-row' + (active ? ' is-active' : '')
        row.setAttribute('aria-pressed', active ? 'true' : 'false')
        const av = document.createElement('span')
        av.className = 'avatar sm'
        paintAvatar(av, name, avatar)
        const meta = document.createElement('span')
        meta.className = 'id-meta'
        const n = document.createElement('span')
        n.className = 'id-name'
        n.textContent = name
        const s = document.createElement('span')
        s.className = 'id-sub'
        s.textContent = sub
        meta.append(n, s)
        row.append(av, meta)
        if (active) {
          const mark = document.createElement('span')
          mark.className = 'id-badge'
          mark.textContent = '当前'
          row.appendChild(mark)
        }
        row.addEventListener('click', () => switchUser(kind))
        return row
      }

      function renderHostidLoginCard() {
        if (!loginHostidHintEl || !loginHostidBtn) return
        const loggedIn = Boolean(users.sso && !sessionExpiredFlag)
        if (sessionExpiredFlag) {
          ssoBadgeEl.textContent = '会话已失效'
          ssoBadgeEl.className = 'tag tag--danger'
        } else if (users.sso) {
          ssoBadgeEl.textContent = '已登录'
          ssoBadgeEl.className = 'tag tag--ok'
        } else {
          ssoBadgeEl.textContent = '未登录'
          ssoBadgeEl.className = 'tag'
        }
        hostidForm.hidden = loggedIn
        loginHostidHintEl.hidden = loggedIn
        loginHostidHintEl.textContent = sessionExpiredFlag
          ? '会话已过期，请确认 HostID 地址后重新登录。'
          : '输入 HostID 地址，将在独立窗口完成登录。'
        loginHostidBtn.textContent = sessionExpiredFlag ? '重新登录' : '登录'
      }

      function paintAccountTrigger() {
        const cur = currentIdentity()
        paintAvatar(accountBtnAvatar, cur.name, cur.avatar)
        accountBtn.title = `${cur.name} · ${cur.sub}`
        accountBtn.setAttribute('aria-label', `账户与身份（当前：${cur.name}）`)
        if (sessionExpiredFlag) {
          accountDot.hidden = false
          accountDot.className = 'account-dot account-dot--danger'
        } else if (users.sso) {
          accountDot.hidden = false
          accountDot.className = 'account-dot'
        } else {
          accountDot.hidden = true
        }
      }

      function renderUsers() {
        paintAccountTrigger()
        paintLocalAvatar()

        idsEl.textContent = ''
        idsEl.appendChild(idRow('local', users.local.name || '本地用户', users.local.avatar, '本机模式使用'))
        if (users.sso) {
          const hostDisplay = hostidBase ? hostidBase.replace(/^https?:\/\//, '') : ''
          const subParts = [users.sso.email, hostDisplay].filter(Boolean)
          const subText = subParts.join(' · ') || 'HostID SSO'
          idsEl.appendChild(idRow('sso', users.sso.name, users.sso.avatar, subText))
          ssoProfileEl.hidden = false
          ssoHostEl.textContent = hostDisplay ? `已连接 ${hostDisplay}` : '已登录 HostID 账号'
        } else {
          ssoProfileEl.hidden = true
        }
        renderHostidLoginCard()
      }

      async function switchUser(kind) {
        if (users.current === kind) return
        try {
          users = await invoke('desktop_switch_user', { kind })
          renderUsers()
        } catch (e) {
          toast(String(e), 'error')
        }
      }

      function shrinkAvatar(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onerror = () => reject(new Error('读取图片失败'))
          reader.onload = () => {
            const img = new Image()
            img.onerror = () => reject(new Error('不支持的图片格式'))
            img.onload = () => {
              const size = 128
              const canvas = document.createElement('canvas')
              canvas.width = size
              canvas.height = size
              const side = Math.min(img.width, img.height)
              canvas
                .getContext('2d')
                .drawImage(
                  img,
                  (img.width - side) / 2,
                  (img.height - side) / 2,
                  side,
                  side,
                  0,
                  0,
                  size,
                  size,
                )
              resolve(canvas.toDataURL('image/jpeg', 0.8))
            }
            img.src = reader.result
          }
          reader.readAsDataURL(file)
        })
      }

      invoke('desktop_users')
        .then((u) => {
          users = u
          localNameEl.value = (u.local && u.local.name) || ''
          renderUsers()
        })
        .catch(() => renderUsers())

      listen('rukksh://user', (event) => {
        users = event.payload
        renderUsers()
        refreshHostidBase()
        invoke('desktop_state').then(render).catch(() => {})
      })

      pickAvatarBtnEl.addEventListener('click', () => avatarFileEl.click())
      localNameEl.addEventListener('input', paintLocalAvatar)

      avatarClearEl.addEventListener('click', () => {
        pendingAvatar = ''
        paintLocalAvatar()
        toast('头像已移除，点「保存」生效')
      })

      avatarFileEl.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0]
        e.target.value = ''
        if (!file) return
        try {
          pendingAvatar = await shrinkAvatar(file)
          paintLocalAvatar()
          toast('头像已选，点「保存」生效')
        } catch (err) {
          toast(String(err.message || err), 'error')
        }
      })

      async function saveLocalUser() {
        const name = localNameEl.value.trim()
        const avatar = localAvatarDraft()
        try {
          await invoke('desktop_save_local_user', { name, avatar })
          pendingAvatar = null
          users.local = { name, avatar }
          renderUsers()
          toast('已保存；下次启动本地服务器时生效')
        } catch (e) {
          toast(String(e), 'error')
        }
      }

      document.getElementById('save-local').addEventListener('click', saveLocalUser)
      localNameEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
          e.preventDefault()
          saveLocalUser()
        }
      })

      document.getElementById('logout-sso').addEventListener('click', async () => {
        try {
          await invoke('desktop_logout_hostid')
        } catch (e) {
          toast(String(e), 'error')
        }
      })

      hostidForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        try {
          await invoke('desktop_login_hostid', { url: hostidUrlEl.value })
        } catch (err) {
          toast(String(err), 'error')
        }
      })

      hostidUrlEl.addEventListener('input', renderHostidLoginCard)

      /* -------------------------------------------------------- 会话失效横幅 */

      const sessionBanner = document.getElementById('session-banner')

      function paintSessionBanner() {
        sessionBanner.hidden = !sessionExpiredFlag
        paintAccountTrigger()
        renderHostidLoginCard()
      }

      function refreshHostidBase() {
        invoke('desktop_hostid_base')
          .then((base) => {
            hostidBase = typeof base === 'string' ? base.trim() : ''
            if (hostidBase && !hostidUrlEl.value) hostidUrlEl.value = hostidBase
            renderUsers()
          })
          .catch(() => {})
      }
      refreshHostidBase()

      document.getElementById('session-dismiss').addEventListener('click', () => {
        sessionExpiredFlag = false
        paintSessionBanner()
        invoke('desktop_dismiss_session_notice').catch(() => {})
      })

      document.getElementById('session-relogin').addEventListener('click', async () => {
        try {
          await invoke('desktop_relogin_hostid')
        } catch (e) {
          setAccountPanelOpen(true)
          hostidUrlEl.focus()
          toast(String(e), 'error')
        }
      })
    </script>
  </body>
</html>

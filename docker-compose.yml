# rukksh 生产编排：前后端分离两个容器
#   frontend = nginx（托管 Vite 产物 + 反代 /api → backend）
#   backend  = Spring Boot jar（SQLite；模型等业务配置在页面维护并存入数据库）
# 用法（Docker Compose 2.24.0+）：
#   docker compose up -d --build
#   访问 http://localhost:18081
name: rukksh

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rukksh-backend:latest
    container_name: rukksh-backend
    restart: unless-stopped
    init: true
    shm_size: '256mb'
    security_opt:
      - seccomp=./backend/browser-seccomp.json
    # 按需用 backend/.env 覆盖部署参数（如 SSO / 代理）
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 容器内固定为挂载卷路径，覆盖 .env 里相对 maven 工作目录的默认值
      RUKKSH_DB_PATH: "${RUKKSH_DB_PATH:-/data/rukksh.db}"
      RUKKSH_ARTICLE_DIR: /data/article
      RUKKSH_PORT: "18081"
    volumes:
      # 持久化：SQLite 库 + markdown 文章目录
      - rukksh-data:/data
      # 本机工作空间：按需挂载宿主机项目目录，在页面填写容器内路径。
      # - /srv/projects:/workspaces
      # 若想直接复用仓库 ./data 目录，可改用 bind mount（Windows 上 WAL 可能受文件系统影响，慎用）：
      # - ./data:/data
    # 仅内网可达：由 frontend 反代访问，无需对外暴露端口
    expose:
      - "18081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rukksh-frontend:latest
    container_name: rukksh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主机端口可用根目录 .env 的 RUKKSH_HOST_PORT 覆盖
      - "${RUKKSH_HOST_PORT:-18081}:80"

volumes:
  rukksh-data:
    name: "${RUKKSH_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}-data}"
    external: "${RUKKSH_DATA_VOLUME_EXTERNAL:-false}"

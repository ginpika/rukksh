[package]
name = "minis-desktop"
version = "0.1.0"
edition = "2021"
description = "minis 桌面壳（本机 / 远程双模式）"

[[bin]]
name = "Rukksh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSToolbar",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSHTTPCookie",
    "NSObject",
    "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKHTTPCookieStore",
] }
xcap = "0.9.8"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

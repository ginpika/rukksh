name: Docker Build and Verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild images without using the Docker cache
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's Compose 2.38.2 cannot parse build.provenance.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.7.0

      - name: Validate the published-image Compose configuration
        env:
          RUKKSH_IMAGE_TAG: sha-${{ github.sha }}
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet

      - name: Build all three images with Compose
        env:
          NO_CACHE: ${{ inputs.no-cache }}
        run: |
          flags=(--pull)
          if [[ "$NO_CACHE" == true ]]; then flags+=(--no-cache); fi
          docker compose -f docker-compose.yml -f docker-compose.fullstack.yml -f - \
            --profile fullstack build "${flags[@]}" <<'YAML'
          x-build: &ci-build
            provenance: false
            labels:
              org.opencontainers.image.source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
              org.opencontainers.image.revision: ${GITHUB_SHA}
          services:
            backend:
              build: *ci-build
            frontend:
              build: *ci-build
            rukksh:
              build: *ci-build
          YAML

      - name: Verify web startup, API proxy and SQLite
        run: |
          docker compose up -d --no-build --pull never
          url=http://127.0.0.1:18081
          curl --fail --silent --show-error --max-time 5 \
            --retry 45 --retry-delay 2 --retry-all-errors "$url/api/health" | \
            jq -e '.status == "ok" and (.version | type == "string" and . != "dev")'
          curl --fail --silent --show-error "$url/" | grep -F '<div id="root"></div>'
          docker compose exec -T backend test -s /data/rukksh.db

      - name: Verify the standalone image
        run: |
          docker run -d --name rukksh-fullstack-smoke --init --shm-size 256m \
            -p 127.0.0.1:18082:18081 rukksh:latest
          url=http://127.0.0.1:18082
          curl --fail --silent --show-error --max-time 5 \
            --retry 45 --retry-delay 2 --retry-all-errors "$url/api/health" | \
            jq -e '.status == "ok" and (.version | type == "string" and . != "dev")'
          html=$(curl --fail --silent --show-error "$url/")
          grep -F '<div id="root"></div>' <<< "$html"
          asset=$(sed -nE 's|.*<script type="module"[^>]*src="(/assets/[^" ]+\.js)".*|\1|p' <<< "$html")
          test -n "$asset"
          curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}\n' "$url$asset" | \
            grep -E '^(application|text)/(javascript|ecmascript)'
          docker exec rukksh-fullstack-smoke test -s /data/rukksh.db

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          if docker container inspect rukksh-fullstack-smoke >/dev/null 2>&1; then
            docker logs rukksh-fullstack-smoke
          fi

      - name: Stop the test environment
        if: always()
        run: |
          if docker container inspect rukksh-fullstack-smoke >/dev/null 2>&1; then
            docker rm --force --volumes rukksh-fullstack-smoke
          fi
          docker compose down --volumes

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images for this architecture
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          config=$(docker compose -f docker-compose.yml -f docker-compose.fullstack.yml --profile fullstack config --format json)
          for service in rukksh backend frontend; do
            local_image=$(jq -er --arg service "$service" '.services[$service].image' <<< "$config")
            suffix="-$service"
            if [[ "$service" == rukksh ]]; then suffix=''; fi
            # Keep the candidate tag stable across reruns of failed matrix jobs.
            candidate="ghcr.io/${GITHUB_REPOSITORY,,}$suffix:build-$GITHUB_RUN_ID-$ARCH"
            docker tag "$local_image" "$candidate"
            docker push "$candidate"
          done

  publish:
    name: Publish multi-platform images
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: docker-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify both architectures
        run: |
          for suffix in '' -backend -frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}$suffix"
            docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" \
              "$image:build-$GITHUB_RUN_ID-amd64" "$image:build-$GITHUB_RUN_ID-arm64"
            docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" | \
              jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          done

      - name: Publish release tags and write deployment summary
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          alias_tag=''
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            alias_tag=${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}
            alias_tag=${alias_tag:0:128}
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')
            if [[ "$head" == "$GITHUB_SHA" ]]; then alias_tag=latest; fi
          fi

          for suffix in '' -backend -frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}$suffix"
            if [[ -n "$alias_tag" && "$alias_tag" != "sha-$GITHUB_SHA" ]]; then
              docker buildx imagetools create --tag "$image:$alias_tag" "$image:sha-$GITHUB_SHA"
            fi
            echo "- \`$image:sha-$GITHUB_SHA\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Use \`ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA\` for the single-container deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Use \`RUKKSH_IMAGE_TAG=sha-$GITHUB_SHA\` for the two-container Compose deployment." >> "$GITHUB_STEP_SUMMARY"
